<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="38%" cy="34%" r="80%">
      <stop offset="0%" stop-color="#fff4d1"/>
      <stop offset="45%" stop-color="#f2c455"/>
      <stop offset="78%" stop-color="#d99a2b"/>
      <stop offset="100%" stop-color="#b4791e"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6b4321"/>
      <stop offset="100%" stop-color="#4a2c15"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffaf0"/>
      <stop offset="100%" stop-color="#f4e6c4"/>
    </linearGradient>
  </defs>

  <!-- disco externo -->
  <circle cx="256" cy="256" r="248" fill="url(#ring)"/>
  <circle cx="256" cy="256" r="230" fill="url(#bg)"/>

  <!-- raio de luz sutil, como na capa -->
  <path d="M 60 80 L 300 40 L 130 300 Z" fill="#fff9e3" opacity="0.18"/>

  <!-- livro aberto -->
  <g transform="translate(256 300)">
    <path d="M 0 -22 C -70 -46 -132 -40 -168 -20 L -168 46 C -132 26 -70 22 0 44 Z" fill="url(#page)" stroke="#6b4321" stroke-width="5" stroke-linejoin="round"/>
    <path d="M 0 -22 C 70 -46 132 -40 168 -20 L 168 46 C 132 26 70 22 0 44 Z" fill="url(#page)" stroke="#6b4321" stroke-width="5" stroke-linejoin="round"/>
    <path d="M 0 -22 L 0 44" stroke="#6b4321" stroke-width="5"/>
    <!-- linhas de texto -->
    <path d="M -140 -6 L -34 6 M -142 10 L -34 22 M -142 26 L -50 36" stroke="#b98b4e" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <path d="M 140 -6 L 34 6 M 142 10 L 34 22 M 142 26 L 50 36" stroke="#b98b4e" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- pena -->
  <g transform="translate(256 300) rotate(-38)">
    <path d="M -8 -190 C 30 -160 34 -80 6 -6 C -2 18 -14 30 -26 34 C -20 10 -18 -4 -14 -20 C -34 -6 -44 6 -50 24 C -54 4 -46 -24 -22 -46 C -36 -40 -46 -32 -54 -20 C -50 -60 -30 -140 -8 -190 Z" fill="#fdfaf2" stroke="#6b4321" stroke-width="5" stroke-linejoin="round"/>
    <path d="M -8 -186 C -6 -120 -8 -50 -14 8" stroke="#6b4321" stroke-width="3.5" fill="none" opacity="0.6"/>
  </g>

  <!-- iniciais -->
  <text x="256" y="182" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="86" fill="#5a3620">T</text>

  <!-- faixa IBBC -->
  <path id="arc" d="M 106 358 A 175 175 0 0 0 406 358" fill="none"/>
  <text font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="30" letter-spacing="6" fill="#4a2c15">
    <textPath href="#arc" startOffset="50%" text-anchor="middle">IBBC</textPath>
  </text>
