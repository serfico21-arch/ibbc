<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulado: Pena de Morte — A Favor e Contra</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1f2a44;--mu:#5b6478;--bd:#d9deea;--pro:#1b7a3a;--con:#b3261e;--gen:#d99a00;--ok:#dff3e4;--no:#fde3e1;--ac:#1f2a44;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141f;--card:#1a2030;--tx:#eef1f8;--mu:#a3adc2;--bd:#2c3550;--ok:#173a24;--no:#44201d;--ac:#e0aa47;color-scheme:dark}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0 4px}p.s{color:var(--mu);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:8px 14px;font:inherit;font-size:15px;cursor:pointer}
.chip.on{border-color:var(--ac);background:var(--ac);color:var(--bg)}
button.go,button.nx{width:100%;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:700;background:var(--ac);color:var(--bg);cursor:pointer;margin-top:8px}
button.go.alt{background:transparent;color:var(--tx);border:2px solid var(--ac)}
.tag{display:inline-block;color:#fff;font-weight:700;font-size:13px;padding:2px 10px;border-radius:6px;margin-bottom:8px}
.tag.P{background:var(--pro)}.tag.C{background:var(--con)}.tag.G{background:var(--gen)}
.bar{height:6px;background:var(--bd);border-radius:9px;margin:6px 0 12px}.bar i{display:block;height:100%;background:var(--ac);border-radius:9px}
.top{display:flex;justify-content:space-between;color:var(--mu);font-size:14px}
.q{font-weight:700;margin:0 0 12px}
.o{display:block;width:100%;text-align:left;font:inherit;color:var(--tx);background:var(--card);border:2px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer}
.o.ok{background:var(--ok);border-color:var(--pro)}.o.no{background:var(--no);border-color:var(--con)}
.ex{margin-top:10px;padding:12px;border-radius:12px;background:var(--bg);border-left:4px solid var(--ac);font-size:15px}
.big{font-size:44px;font-weight:800;text-align:center;margin:6px 0}
.rv{border-left:4px solid var(--con);padding:6px 10px;margin:10px 0;font-size:15px}
.hide{display:none}
</style></head><body><main>
<div id="home">
<h1>Simulado: Pena de Morte</h1>
<p class="s">Argumentos A FAVOR e CONTRA. Errou? A resposta certa aparece na hora, com a explicação.</p>
<div class="card"><b>Escolha o tipo de pergunta</b>
<div class="chips" id="chips"></div>
<button class="go" onclick="start(10)">Rodada de 10 perguntas</button>
<button class="go alt" onclick="start(0)">Todas as perguntas do tipo escolhido</button>
<p class="s" style="margin-top:12px;font-size:14px" id="cnt"></p></div></div>
<div id="game" class="hide"></div>
<div id="end" class="hide"></div>
</main>
<script>
const D=[
["P","Qual é o fundamento dado em Gn 9:6 para quem derrama sangue humano responder por isso?","Porque o homem foi feito à imagem de Deus","Porque Israel é o povo escolhido","Porque a terra tinha sido destruída pelo dilúvio","Porque a Lei de Moisés já estava em vigor","A vida vale muito por ser imagem de Deus. Esse é o centro do argumento A FAVOR."],
["P","Segundo quem defende a pena de morte, para quem Deus deu a ordem de Gn 9:6?","Para Noé e sua descendência, toda a humanidade","Só para Israel","Só para os sacerdotes","Só para os reis","A ordem foi dada a Noé, antes de Israel existir. Por isso, dizem, não é limitada à Lei de Moisés."],
["P","A Lei de Êx 21:12 (“quem ferir alguém, de modo que este morra, certamente será morto”) trata de:","Homicídio intencional","Qualquer morte, até a acidental","Só homicídio de parentes","Só homicídio de sacerdotes","A Lei separava o homicídio doloso (de propósito) do involuntário (Nm 35)."],
["P","Em Rm 13:4, o que é a “espada” que o governo não traz “debalde”?","O poder de punir do Estado, como ministro de Deus","Uma arma de uso pessoal do cristão","A autoridade da igreja","Só a guerra entre nações","O texto dá autoridade ao Estado. Há debate se ela inclui a pena de morte."],
["P","O que Paulo disse diante de Festo em At 25:11?","Que, se fizesse algo digno de morte, não recusaria morrer","Que a pena de morte é proibida","Que cristãos não se submetem ao Estado","Que era inocente por ser cidadão romano","Paulo aceita a autoridade do Estado de punir quem for culpado."],
["P","Qual texto do NT lembra que quem violava a Lei de Moisés morria sem misericórdia, pelo depoimento de duas ou três testemunhas?","Hb 10:28","Gl 3:24","Tg 2:10","Jo 8:11","Quem defende a pena de morte usa Hb 10:28 para mostrar que o NT não trata a Lei como brincadeira."],
["P","Como os defensores respondem ao argumento “Deus poupou Caim” (Gn 4:15)?","Caim viveu antes de Gn 9:6 e da Lei, quando essa regra ainda não existia","Caim não matou ninguém","Deus nunca poupou ninguém","A história de Caim é só uma lenda","Para eles, a regra de Gn 9:6 veio depois do caso de Caim."],
["P","Em Mt 5:21, o que Jesus faz com o “Não matarás”?","Reafirma o mandamento e vai à raiz: o ódio também é pecado","Revoga o mandamento","Diz que só vale para os judeus","Diz que a pena é injusta","Jesus leva o homicídio a sério. Para o lado A FAVOR, ele não tirou o peso da justiça."],
["C","O que Deus fez com Caim, que matou o irmão (Gn 4:15)?","Protegeu-o com um sinal, para ninguém matá-lo","Mandou executá-lo","Entregou-o aos anciãos","Deixou-o sem castigo nenhum","Deus nem sempre exigiu a morte do assassino. É um argumento CONTRA."],
["C","Em Jo 8:11, o que Jesus diz à mulher apanhada em adultério?","“Nem eu também te condeno; vai-te, e não peques mais”","“Cumpra-se a Lei e seja apedrejada”","“Pague uma multa ao templo”","“Volte para o seu marido e cale-se”","A Lei previa a morte, e Jesus deu perdão e nova chance. Nota: alguns manuscritos antigos não trazem essa passagem, e um professor pode lembrar disso."],
["C","O que a Lei mandava fazer com o filho rebelde (Dt 21:18-21)?","Apedrejá-lo, depois de levado aos anciãos","Expulsá-lo de casa","Cobrar uma multa dos pais","Entregá-lo aos sacerdotes para estudar","Quem usa a Lei para condenar o homicida teria de aplicar também esse texto. Tg 2:10: falhar em um ponto é falhar na Lei toda."],
["C","O que Tg 2:10 diz sobre quem usa só parte da Lei?","Quem guarda toda a lei e tropeça em um ponto torna-se culpado de todos","A Lei pode ser escolhida por partes","A Lei só vale para o Estado","A Lei foi abolida","É o argumento CONTRA de que não dá para escolher só o que ajuda a tese."],
["C","O que Ez 18:32 diz sobre a morte do ímpio?","Deus não tem prazer nela e quer que ele se converta e viva","Deus se alegra com a justiça feita","O ímpio deve morrer sem chance","Só o povo de Israel pode julgá-lo","Para o lado CONTRA, a execução tira a chance de conversão."],
["C","Rm 12:19 diz “Minha é a vingança”. De qual livro do AT Paulo tira essa frase?","Dt 32:35","Gn 9:6","Êx 21:12","Sl 23","Paulo cita Dt 32:35: o cristão não se vinga, e entrega a justiça a Deus."],
["C","Qual é o argumento CONTRA sobre o sistema da Lei de Israel?","Era um sistema teocrático antigo, e a igreja hoje não é uma nação assim","A Lei nunca veio de Deus","A Lei foi escrita por Paulo","Israel nunca teve leis civis","Israel tinha Deus como rei e legislador. A igreja é um povo espiritual de todas as nações."],
["C","Segundo Gl 3:24, a Lei foi nosso aio para nos conduzir a:","Cristo","Roma","Moisés","Jerusalém","Para o lado CONTRA, Cristo cumpriu o propósito da Lei, que apontava para ele."],
["C","Qual é o argumento CONTRA baseado no risco de erro da justiça humana?","Inocentes podem ser mortos por não provarem sua inocência a tempo, e a execução não tem volta","Todo condenado é sempre culpado","Erros nunca acontecem","O Estado nunca erra","É um dos argumentos do livro de Ética Cristã usado na aula."],
["C","Em Mt 5:38-39, como Jesus responde ao “olho por olho”?","“Não resistais ao mau”, e oferecer a outra face a quem bate","Manda cobrar na mesma medida","Manda levar o caso ao rei","Aprova a vingança","O tema é a retaliação pessoal. Quem defende a pena de morte lembra que esse texto fala de relações pessoais, e não do papel do Estado."],
["C","O que Jesus disse a Pedro em Mt 26:52?","Todos os que lançarem mão da espada à espada morrerão","Compre uma espada","Use a espada contra Roma","A espada é um dom de Deus","Usado contra a violência. A outra parte do debate diz que o texto trata de violência pessoal, e não da autoridade do Estado."],
["C","Segundo 2Pe 3:9, o que Deus quer?","Que todos venham a arrepender-se","Que os ímpios sejam punidos logo","Que só os justos vivam","Que os homens se vinguem","Para o lado CONTRA, a pena de morte fecha a porta do arrependimento."],
["G","O que o ladrão na cruz mostra para o nosso tema (Lc 23:43)?","Que um condenado à morte pode se arrepender e ser perdoado","Que Jesus aprovou a crucificação","Que só inocentes são salvos","Que a pena de morte é sempre injusta","Os dois lados usam o texto: a conversão é possível até o fim, mas a salvação não depende de escapar da pena."],
["G","Quantas testemunhas eram exigidas para condenar alguém à morte (Dt 17:6)?","Duas ou três","Uma","Sete","Só o sacerdote decidia","A Lei já se preocupava em não condenar inocentes."],
["G","Para que serviam as cidades de refúgio (Nm 35)?","Proteger quem matou sem intenção até o julgamento","Esconder criminosos","Abrigar sacerdotes","Servir de prisão","Mostram que a Lei distinguia o homicídio doloso do culposo."],
["G","Como responder a “se Êx 20:13 diz ‘Não matarás’, como a Lei mandava executar?”","O verbo hebraico (ratsach) se refere ao assassinato, ao homicídio ilegítimo","A Lei se contradiz","O mandamento vale só para parentes","O mandamento foi acrescentado depois","Resposta usada pelo lado A FAVOR. O lado CONTRA lembra que Jesus levou o “Não matarás” à raiz do coração."],
["G","O que diz a Constituição Federal (art. 5º, XLVII, a) sobre a pena de morte?","É proibida, salvo em caso de guerra declarada","É permitida para crimes hediondos","É permitida por plebiscito","Não é mencionada","No Brasil, a questão é teológica e ética, e não uma decisão legal em vigor."],
["G","O que significa “cumprir” a Lei em Mt 5:17?","Levar à plenitude, ao sentido completo","Revogar","Suspender por um tempo","Copiar sem mudanças","Jesus obedeceu a Lei por inteiro, realizou o que ela anunciava e revelou o seu coração: o amor."]
];
const L={T:"Todas",P:"A favor",C:"Contra",G:"Gerais"};let f="T",Q=[],i=0,sc=0,miss=[];
const $=id=>document.getElementById(id);
const sh=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
function chips(){$("chips").innerHTML=Object.keys(L).map(k=>`<button class="chip ${k==f?"on":""}" onclick="f='${k}';chips()">${L[k]}</button>`).join("");const n=D.filter(d=>f=="T"||d[0]==f).length;$("cnt").textContent=n+" perguntas disponíveis neste tipo. A ordem e as alternativas mudam a cada vez.";}
function start(n){let p=sh(D.filter(d=>f=="T"||d[0]==f));Q=n?p.slice(0,n):p;i=0;sc=0;miss=[];$("home").classList.add("hide");$("end").classList.add("hide");$("game").classList.remove("hide");show()}
function show(){const d=Q[i],o=sh([d[2],d[3],d[4],d[5]]);
$("game").innerHTML=`<div class="top"><span>Pergunta ${i+1} de ${Q.length}</span><span>Acertos: ${sc}</span></div><div class="bar"><i style="width:${i/Q.length*100}%"></i></div><div class="card"><span class="tag ${d[0]}">${{P:"A FAVOR",C:"CONTRA",G:"GERAL"}[d[0]]}</span><p class="q">${d[1]}</p><div id="os">${o.map(t=>`<button class="o" data-t="${t.replace(/"/g,"&quot;")}">${t}</button>`).join("")}</div><div id="ex"></div></div>`;
document.querySelectorAll(".o").forEach(b=>b.onclick=()=>ans(b,d))}
function ans(b,d){const bs=document.querySelectorAll(".o");bs.forEach(x=>{x.disabled=true;if(x.dataset.t==d[2])x.classList.add("ok")});
const right=b.dataset.t==d[2];if(right)sc++;else{b.classList.add("no");miss.push(d)}
$("ex").innerHTML=`<div class="ex"><b>${right?"Certo!":"Resposta certa: "+d[2]}</b><br>${d[6]}</div><button class="nx" onclick="nxt()">${i+1<Q.length?"Próxima":"Ver resultado"}</button>`}
function nxt(){i++;i<Q.length?show():fim()}
function fim(){$("game").classList.add("hide");const e=$("end");e.classList.remove("hide");const p=Math.round(sc/Q.length*100);
e.innerHTML=`<div class="card"><div class="big">${sc} / ${Q.length}</div><p style="text-align:center">${p}% de acerto. ${p>=80?"Você está seguro para apresentar.":"Revise os erros abaixo e tente de novo."}</p>${miss.length?"<b>Para revisar:</b>"+miss.map(d=>`<div class="rv"><b>${d[1]}</b><br>Certa: ${d[2]}<br><small>${d[6]}</small></div>`).join(""):""}<button class="go" onclick="start(Q.length>=${D.length}?0:10)">Nova rodada</button><button class="go alt" onclick="home()">Voltar ao início</button></div>`;window.scrollTo(0,0)}
function home(){$("end").classList.add("hide");$("home").classList.remove("hide");chips()}
chips();
</script></body></html>
